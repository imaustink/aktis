replicaCount: 1

image:
  repository: ghcr.io/imaustink/agent-controller/connection-broker
  # CI publishes this image to GHCR as `:latest` and `:<sha>` only — never as the
  # chart appVersion — so an empty tag (which resolves to appVersion) would
  # ImagePullBackOff. The other images get `:latest` from values-production.yaml;
  # the broker has no production override, so it carries the default here. A
  # controlled release should pin this to the published `:<sha>` instead.
  # skaffold overrides repository+tag at build time for local/e2e, so this does
  # not affect those paths.
  tag: "latest"
  # Always, not IfNotPresent: with a mutable :latest tag a node that cached the
  # image once would keep running the old broker across redeploys. Matches how
  # values-production.yaml pins every :latest image. (A :<sha> pin could use
  # IfNotPresent, since the tag itself changes.)
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Namespace the broker watches for Corpus/Connection CRs and reads their
# credential Secrets from. Empty = the release namespace. Set this (or the
# umbrella chart's global.knowledgeBaseNamespace) to keep knowledge bases in a
# namespace separate from where the release is installed. The broker's Role and
# RoleBinding are created in this namespace; it must exist, and the broker never
# reads outside it.
knowledgeBaseNamespace: ""

serviceAccount:
  # This app DOES talk to the k8s API: it watches Connection CRs and reads the
  # Secrets they name, so the token is mounted and rbac.yaml grants exactly
  # those two things.
  create: true
  annotations: {}
  name: ""
  automount: true

rbac:
  # Namespace-scoped, and deliberately narrow. The broker can read Connections
  # and the Secrets those Connections reference — it never writes either, and
  # never sees any other kind of object. It is the process holding every
  # client's third-party credentials, so its cluster reach is the thing most
  # worth keeping small.
  create: true

service:
  type: ClusterIP
  port: 8080

# The credential the orchestrator presents to probe on a user's behalf. It can
# NEVER cause a connection's service credential to be spent (docs/adr/0038 §3).
orchestratorTokenSecret:
  name: connection-broker-auth
  key: orchestratorToken

# Per-connection sync tokens, exposed as SYNC_TOKEN_<CONNECTION>. One token per
# connection rather than one for all of them, so a leaked sync credential
# reaches one client's source instead of every client's.
syncTokenSecret:
  name: connection-broker-sync-tokens

# Indexing (docs/adr/0059). With qdrant.url, embeddings.apiKeySecret.name and
# temporal.address all set, the `sync` Deployment below indexes every synced
# Corpus; with any unset the broker serves the API only and nothing indexes —
# a real arrangement (another process may own ingestion).
qdrant:
  # Qdrant's REST URL, as the broker always took it. corpus-sync speaks gRPC
  # to the same host on grpcPort; an https:// URL means TLS.
  url: ""
  grpcPort: 6334
  apiKeySecret:
    name: ""
    key: apiKey

# Each Corpus's sync -- its interval, the passes webhooks ask for, and
# POST /corpora/:name/sync -- is a Temporal workflow corpus-sync runs
# (docs/adr/0058 §2, docs/adr/0059). The broker only signals and updates
# those workflows. Same Temporal cluster and namespace as temporal-engine's.
temporal:
  # Matches the temporalio/temporal chart's frontend Service (and
  # temporal-engine.temporal.address).
  address: temporal-frontend.temporal.svc:7233
  namespace: default
  # corpus-sync polls this queue and the broker sends to it; workflow ids live
  # under it, so two releases sharing a namespace must not share it.
  taskQueue: corpus-sync
  # Where a docs/adr/0058 broker ran these loops. corpus-sync terminates any
  # left there. "" turns the drain off; remove it one release after 0059.
  # Only used with the default taskQueue: an overridden queue's 0058 loops sit
  # at the new ids, and corpus-sync replaces those before starting its own.
  legacyTaskQueue: connection-broker

# The indexer: corpus-sync (orchestrator/engines/temporal/cmd/corpus-sync),
# deployed whenever indexing is configured (see qdrant above). It reads
# sources only through this broker's Service with each Corpus's sync token
# (syncTokenSecret), so it holds no third-party credential, and its own
# ServiceAccount reads Corpora and writes their status -- nothing else.
sync:
  replicaCount: 1
  image:
    repository: ghcr.io/imaustink/agent-controller/temporal-engine-corpus-sync
    # Same as the broker's: CI publishes `:latest` and `:<sha>` only.
    tag: "latest"
    pullPolicy: Always
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # A pass holds its corpus's chunks in memory while it embeds them.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 512Mi
  podAnnotations: {}

# Where each provider's API lives, when it is not the vendor's public cloud.
#
# Empty means the driver's own default, which is what a Cloud tenant wants. A
# Confluence Data Center or Server install serves the REST API from the site
# itself with no `api.atlassian.com` in front, and a deployment pointed at one
# has to be able to say so.
#
# Process-wide rather than per-Connection: an installation talks to one
# Atlassian or another, not to both, and a per-Connection field would invite
# pointing two Corpora at two different Atlassians while sharing a credential.
#
# The e2e environment sets `atlassian` to its in-cluster stand-in, the same way
# fake-github is reached through `githubApiUrl`.
apiOrigins:
  atlassian: ""
  slack: ""
  gdrive: ""
  jazzhr: ""

embeddings:
  # Must match whatever the engines embed with: a knowledge base merges scores
  # from several collections as if directly comparable, which holds only when
  # every collection was built by the same model. Used by corpus-sync; the
  # broker itself no longer embeds.
  model: text-embedding-3-small
  apiKeySecret:
    name: ""
    key: apiKey

# Sized for PDF extraction, which is the only thing here that touches real
# memory. A bounded 25MB PDF plus pdf.js's working set peaks well above the
# steady state of a service that otherwise just proxies HTTP, and the parser
# itself costs about 9MB one-off on first use. 512Mi left little margin for a
# large file arriving during a sync.
resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    memory: 768Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
