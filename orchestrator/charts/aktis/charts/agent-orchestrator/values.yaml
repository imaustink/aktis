replicaCount: 1

image:
  repository: agent-orchestrator
  # Defaults to .Chart.AppVersion if empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Creates the ServiceAccount the orchestrator runs as (see rbac.create
  # below for the permissions bound to it: read/watch EventTrigger CRs only).
  create: true
  annotations: {}
  name: ""
  automount: true

rbac:
  # Namespace-scoped Role + RoleBinding (never a ClusterRole — the
  # orchestrator only reads EventTrigger CRs in one namespace, docs/adr/0048).
  create: true

# Namespace the orchestrator reads EventTrigger CRs from (AGENT_NAMESPACE).
# Defaults to the release namespace when empty.
namespace: ""

ports:
  http: 8081

# Seconds to sleep in preStop before the process is signalled, so the pod
# outlives its own endpoint removal.
#
# SIGTERM and endpoint removal are concurrent, and this pod loses that race:
# `/invoke` answers 202 immediately, so the shutdown drain has nothing in flight
# to wait for and the process exits ~1s after SIGTERM, while kube-proxy applies
# endpoint changes at most once a second. A caller connecting in the gap hits an
# address with nothing behind it and waits out a ~10.5s connect timeout rather
# than being refused. Measured: 5 of 10 rollouts lost a poll from a
# gateway-shaped client.
#
# 5s covers a 1s proxy sync with room to spare and sits well inside the default
# 30s terminationGracePeriodSeconds. It delays only rollouts, never a request.
# Set to 0 (or "") to disable -- e.g. on Kubernetes older than 1.30, where the
# `sleep` preStop action does not exist.
preStopSleepSeconds: 5

config:
  # Ignored when qdrant.enabled=true below (the in-cluster subchart's
  # Service URL is derived automatically instead). Set this to point at an
  # existing/external Qdrant instance otherwise.
  # Qdrant backs only the consumer-supplied tool index (docs/adr/0035); the
  # catalog index belongs to the temporal-engine.
  qdrantUrl: "http://qdrant:6333"
  # The caller-tool store speaks Qdrant's gRPC API (docs/adr/0055) on qdrantUrl's
  # host. Empty = 6334, Qdrant's default gRPC port.
  qdrantGrpcPort: ""
  qdrantVectorSize: 1536
  # Consumer-supplied tools live in their own collection, keyed by content hash
  # so identical definitions are embedded once, ever.
  qdrantCallerToolsCollection: caller_tools
  embeddingModel: text-embedding-3-small
  # Max consumer-supplied tools forwarded to the engine, and the
  # threshold below which the caller-tool index is skipped entirely (with this
  # many or fewer there is nothing to prune). Leave empty for the orchestrator's
  # own defaults (5 tools, 7-day TTL swept hourly).
  callerToolTopK: ""
  callerToolTtlSeconds: ""
  callerToolPruneIntervalSeconds: ""
  # Base URL of the temporal-engine gateway Service. Required: every turn runs
  # on the Temporal engine (docs/adr/0036, 0053), so the chart refuses to
  # render without it.
  #
  # `agentEngine` is no longer read. It is still accepted as "" or "temporal"
  # so existing values files keep rendering; any other value (notably the old
  # "langgraph" rollback setting) fails the render, because the in-process
  # LangGraph engine was removed (docs/adr/0053).
  temporalEngineUrl: ""
  # API group/version for the EventTrigger CRD. Must match
  # charts/core-controller's installed CRDs.
  crdGroup: core.aktis.ai
  crdVersion: v1alpha1
  # Leave empty for the orchestrator's own defaults (8h, 25s).
  #
  # agentRunTimeoutSeconds bounds how long one turn's poll of the engine runs
  # before the caller is told the turn is still going (its answer arrives on
  # the next message). The turn itself keeps running in the engine.
  agentRunTimeoutSeconds: ""
  shutdownDrainMs: ""
  # Turn authentication. Every POST /invoke and /v1/chat/completions must
  # present a bearer token the resolver below accepts, or (chat only) a
  # verified Open WebUI user JWT (openWebUiUserJwtSecret*). Anything else gets
  # a 401 before the turn runs. This decides whether a turn runs, not who it
  # runs as.
  #
  # "enforce" (default) or "warn". warn logs "would reject" and lets the turn
  # run: set it only while confirming every caller's token is in the map
  # (integration-gateway's GATEWAY_ORCHESTRATOR_TOKEN or OIDC client, Open
  # WebUI's openaiApiKey), then remove it.
  callerAuth: enforce
  #
  # Which IdentityResolver to build: "static" (default) or "oidc". See
  # src/rbac/static-identity-resolver.ts and src/rbac/oidc-identity-resolver.ts.
  identityResolver: static
  # JSON map of bearer token -> {subject, roles}. When identityResolver=static
  # this is the only resolver; when identityResolver=oidc it becomes a
  # fallback for tokens that fail oidc verification (see
  # staticIdentitiesExistingSecret below for the not-mutually-exclusive
  # behavior). Prefer staticIdentitiesExistingSecret for anything beyond
  # local/dev use: `staticIdentities` here lands in plaintext in the Helm
  # release's stored values (same caveat as secrets.create/values above),
  # which is not appropriate once the values file itself is committed
  # anywhere outside a private, secret-free repo.
  staticIdentities: ""
  # Existing Secret name holding the same JSON map (see staticIdentities
  # above) under staticIdentitiesExistingSecretKey. Takes precedence over
  # the inline `staticIdentities` value when set.
  #
  # Not exclusive with identityResolver=oidc: when both are set, the app
  # builds a CompositeIdentityResolver -- oidc verification first, falling
  # back to this static map only for tokens that fail it. Use this for
  # callers that structurally cannot present a real, refreshable OIDC token
  # (e.g. a chat UI with only a static API-key field), while callers capable
  # of real OIDC still go through full verification.
  staticIdentitiesExistingSecret: ""
  staticIdentitiesExistingSecretKey: AGENT_STATIC_IDENTITIES
  # Existing Secret holding the HS256 secret Open WebUI signs its per-request
  # X-OpenWebUI-User-Jwt header with (Open WebUI's own
  # FORWARD_USER_INFO_HEADER_JWT_SECRET, ENABLE_FORWARD_USER_INFO_HEADERS).
  # Required whenever staticIdentitiesExistingSecret/staticIdentities above is
  # serving Open WebUI: without it, every Open WebUI user resolves to the
  # SAME shared subject from the static map (Open WebUI's Authorization
  # bearer token is one static value for all of its users), so any OAuth
  # identity one user links (e.g. GitHub, ADR 0022) becomes usable by every
  # other Open WebUI user with no authentication. See
  # src/rbac/openwebui-forwarded-user-resolver.ts.
  openWebUiUserJwtSecretExistingSecret: ""
  openWebUiUserJwtSecretExistingSecretKey: AGENT_OPENWEBUI_USER_JWT_SECRET
  # RBAC roles (this system's vocabulary, e.g. Tool/Agent allowedRoles --
  # NOT Open WebUI's own "user"/"admin" role) granted to every Open WebUI
  # user resolved via openWebUiUserJwtSecretExistingSecret above. Comma-
  # separated. Defaults (in the app itself) to "reader,writer" -- the same
  # roles the old shared AGENT_STATIC_IDENTITIES entry granted everyone --
  # so leave unset unless you need a narrower/different grant.
  openWebUiUserRoles: ""
  # Required when identityResolver=oidc: expected JWT `iss` claim.
  oidcIssuer: ""
  # Required when identityResolver=oidc: JWKS endpoint used to verify JWT
  # signatures (e.g. an IdP's `.well-known/jwks.json` or provider-specific
  # certs endpoint).
  oidcJwksUri: ""
  # Optional: expected JWT `aud` claim. Leave empty to skip audience
  # verification.
  oidcAudience: ""
  # Dot-path to the roles claim in the verified JWT, e.g. "roles" or
  # "realm_access.roles" (Keycloak).
  oidcRolesClaim: roles
  # Redis URL for the session and /invoke record stores (docs/adr/0016).
  # Ignored when redis.enabled=true below (the in-cluster Service URL is
  # derived automatically). Leave empty for the single-replica in-memory
  # default.
  redisUrl: ""

# integration-gateway's identity-link API. The orchestrator uses it only to
# record each verified Open WebUI caller's email for the Connections page
# (docs/adr/0046); linking itself is the temporal-engine's. `defaultFlow` is
# forwarded to the engine with every turn that doesn't name one.
identityLink:
  enabled: false
  # Base URL of integration-gateway's identity-link API (in-cluster Service
  # DNS). Mirrors config.orchestratorUrl above's naming precedent, just in
  # the opposite direction -- pointing at integration-gateway's Service
  # instead of this chart's own. No default: set this to the
  # integration-gateway release's Service name/port (see that chart's
  # templates/service.yaml), e.g.
  # "http://integration-gateway:8090" for the umbrella chart's pinned name.
  gatewayUrl: ""
  # Which link flow a caller gets when it doesn't name one: "authcode" or
  # "device". Empty -> the app's own default ("authcode").
  #
  # Only /invoke can choose per request (identity_link_flow); the
  # chat-completions facade cannot, so every Open WebUI turn takes this.
  #
  # "authcode" redirects the browser to GitHub, so it REQUIRES the GitHub
  # App's registered "Callback URL" to exactly match integration-gateway's
  # identityLink.githubOauthRedirectUri. "device" shows a user code instead
  # and has no redirect URI, so it is unaffected by that registration -- the
  # flow to pick when the Callback URL can't be corrected.
  defaultFlow: ""
  # Public URL of integration-gateway's Connections page (docs/adr/0046),
  # e.g. "https://gateway.example.com/connections". Set it only once that
  # page is enabled (integration-gateway's connections.enabled). Then:
  #   - each verified Open WebUI caller's email is recorded with the gateway,
  #     which is how the page finds their stored credentials, and
  #   - chat link prompts for Open WebUI users point at the page instead of
  #     straight at the provider (webhook/device-flow callers keep direct links).
  connectionsUrl: ""
  # Secrets: IDENTITY_LINK_GATEWAY_TOKEN (see secrets block below). Must
  # match the value configured as integration-gateway's
  # identityLink.secrets.identityLinkToken (GATEWAY_IDENTITY_LINK_TOKEN env
  # var on that side).

# Secrets: OPENAI_API_KEY (required), AGENT_QDRANT_API_KEY (optional).
#
# By default the chart does NOT create a Secret — bring your own via
# `existingSecret` (e.g. populated by an external-secrets operator / sealed
# secrets / `kubectl create secret`). Setting `create: true` and passing
# values here is provided for local/dev convenience only: those values land
# in plaintext in the Helm release's stored values, which is not appropriate
# for production secrets.
secrets:
  create: false
  existingSecret: ""
  openaiApiKeyKey: OPENAI_API_KEY
  # Not read by agent-orchestrator. Kept because the temporal-engine's
  # callback.secretName may point at this Secret for its HMAC key.
  callbackSecretKey: AGENT_CALLBACK_SECRET
  qdrantApiKeyKey: AGENT_QDRANT_API_KEY
  # Only used when identityLink.enabled=true above.
  identityLinkGatewayTokenKey: IDENTITY_LINK_GATEWAY_TOKEN
  # Verifies integration-gateway's signed sender assertion (docs/adr/0030 §6).
  # MUST match that chart's senderAssertionSecretKey value. When the key is
  # absent from the Secret the orchestrator falls back to trusting the
  # unsigned request-body login and warns at startup.
  senderAssertionSecretKey: AGENT_SENDER_ASSERTION_SECRET
  # Bearer token for the temporal-engine gateway. The engine gateway maps
  # this token to a subject and ROLES, and re-resolves every skill/agent target
  # under them, so an unrecognised or absent token leaves a turn with no
  # capabilities. Must match an entry in that gateway's
  # identity.staticIdentities — or be left out in favour of its
  # defaultSubject/defaultRoles, which is the other way to give the hop an
  # identity.
  temporalEngineTokenKey: AGENT_TEMPORAL_ENGINE_TOKEN
  # Only read when secrets.create=true.
  openaiApiKey: ""
  callbackSecret: ""
  qdrantApiKey: ""
  identityLinkGatewayToken: ""

service:
  invoke:
    type: ClusterIP
    port: 8081

ingress:
  # Exposes the invoke Service (consumer-facing /invoke, /v1/*). Every turn
  # is authenticated (config.callerAuth), but static-map tokens are long-lived
  # shared secrets: prefer identityResolver=oidc for anything this exposes.
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: /
  pathType: Prefix
  tls: []

networkPolicy:
  # Restricts who may reach the invoke port. Disabled by default; enable once
  # you know your cluster's CNI supports NetworkPolicy and you've set the
  # selectors below.
  enabled: false
  # NetworkPolicyPeer list for the invoke port. Empty = allow from anywhere
  # in the cluster (still namespaced to this policy's namespace unless a
  # namespaceSelector is given in a peer).
  invokeFrom: []

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Matches the hardened run contract in run.sh / docs/security.md.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# The runtime image's root filesystem is read-only; only /tmp needs to be
# writable (matches --tmpfs /tmp in run.sh).
extraVolumes:
  - name: tmp
    emptyDir: {}
extraVolumeMounts:
  - name: tmp
    mountPath: /tmp

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

# GET /v1/models needs no auth, so it's a safe, cheap probe target.
livenessProbe:
  httpGet:
    path: /v1/models
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /v1/models
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

extraEnv: []

# Optional bundled Qdrant instance (github.com/qdrant/qdrant-helm). Disabled
# by default -- most real deployments should point config.qdrantUrl at an
# existing Qdrant (managed, shared, or deployed separately) instead of
# coupling its lifecycle to this release. Enabling this is meant for
# local/dev/single-cluster-demo convenience only: it's a single replica with
# no backup/disaster-recovery story (see the subchart's own README for its
# production limitations).
#
# Run `helm dependency update charts/agent-orchestrator` once before
# `helm install`/`helm package` so the subchart is fetched.
qdrant:
  enabled: false
  replicaCount: 1
  # The subchart defaults `config.cluster.enabled: true`, which is wrong for the
  # single replica above and fails closed rather than degrading: pod-0's
  # entrypoint runs `--uri http://<release>-qdrant-0.<release>-qdrant-headless:6335`
  # and Raft dials that address during startup, before qdrant is listening on
  # 6335 itself. It panics in `Can't initialize consensus: Failed to initialize
  # Consensus for new Raft state` (exit 101) and crashloops, which then takes
  # out everything downstream -- agent-orchestrator blocks on its qdrant startup
  # check, and the temporal worker on `CollectionExists`.
  #
  # Nothing here ever runs more than one replica (values-production.yaml calls
  # it "this single-replica dev/demo instance"), so consensus buys nothing. Turn
  # it off in the base values rather than per-profile: every consumer inherits
  # replicaCount 1, so every consumer has the same bug.
  config:
    cluster:
      enabled: false
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  # Set to true (or a string) to require an API key; then also set it as
  # secrets.qdrantApiKey above so the orchestrator
  # sends the same key. Left disabled by default to keep the local/dev path
  # simple -- enable both sides together for anything less trusted than a
  # single-tenant dev cluster.
  apiKey: false

# Optional lightweight Redis instance for the session and /invoke record stores
# (docs/adr/0016). Uses the official redis:alpine image (no Bitnami subchart)
# so there are no external chart dependencies to fetch. Off by default --
# the in-memory session store is used when this is disabled (single replica
# only; a shared Redis store is the scale-out path).
redis:
  enabled: false
  image:
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  storageClass: ""
  storageSize: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
