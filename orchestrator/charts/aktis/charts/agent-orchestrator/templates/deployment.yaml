apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-orchestrator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-orchestrator.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agent-orchestrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "agent-orchestrator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agent-orchestrator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent-orchestrator
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.preStopSleepSeconds }}
          # Outlive our own endpoint removal.
          #
          # SIGTERM and endpoint removal are issued concurrently, and this pod
          # loses that race badly: `/invoke` answers 202 immediately (ADR 0006),
          # so the drain in index.ts has no in-flight request to wait for and
          # the process is gone about a second after SIGTERM -- while kube-proxy
          # applies endpoint changes at most once a second. A caller that
          # connects in the gap reaches an address with nothing behind it, and
          # the kernel retries that same dead peer rather than failing fast: a
          # ~10.5s connect timeout, not a prompt refusal.
          #
          # Sleeping here keeps the pod accepting traffic until every proxy has
          # stopped sending it any. This is the fix for ALL callers; the
          # gateway's own poll retry (orchestrator-client.ts) only covers the
          # gateway. Well inside terminationGracePeriodSeconds, and it delays
          # only the rollout, never a request.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
              protocol: TCP
          env:
            {{- include "agent-orchestrator.otelEnv" . | nindent 12 }}
            - name: AGENT_NAMESPACE
              value: {{ include "agent-orchestrator.toolNamespace" . | quote }}
            - name: AGENT_QDRANT_URL
              value: {{ include "agent-orchestrator.qdrantUrl" . | quote }}
            - name: AGENT_QDRANT_VECTOR_SIZE
              value: {{ .Values.config.qdrantVectorSize | quote }}
            - name: AGENT_QDRANT_CALLER_TOOLS_COLLECTION
              value: {{ .Values.config.qdrantCallerToolsCollection | quote }}
            {{- if .Values.config.callerToolTopK }}
            - name: AGENT_CALLER_TOOL_TOP_K
              value: {{ .Values.config.callerToolTopK | quote }}
            {{- end }}
            {{- $engine := .Values.config.agentEngine | default "" }}
            {{- if not (has $engine (list "" "temporal")) }}
            {{- fail (printf "agent-orchestrator.config.agentEngine=%q is no longer supported: the in-process LangGraph engine was removed (docs/adr/0053) and every turn runs on the Temporal engine. Remove agentEngine from your values." $engine) }}
            {{- end }}
            # Every turn runs on the Temporal engine (docs/adr/0036, 0053): the
            # orchestrator forwards it to the temporal-engine gateway.
            - name: AGENT_TEMPORAL_ENGINE_URL
              value: {{ required "agent-orchestrator.config.temporalEngineUrl is required: the orchestrator forwards every turn to the temporal-engine gateway (docs/adr/0053)" .Values.config.temporalEngineUrl | quote }}
            {{- if .Values.secrets.temporalEngineTokenKey }}
            # Bearer token presented to the engine gateway, which resolves it
            # to a subject and ROLES against its own static identity map. The
            # engine re-resolves every skill/agent target under those roles, so
            # without a token that the gateway recognises it falls closed to
            # zero capabilities and every turn is denied.
            #
            # Optional, because the alternative to a token is the gateway's
            # defaultSubject/defaultRoles rather than a broken pod — but one of
            # the two has to be configured for a turn to resolve anything.
            - name: AGENT_TEMPORAL_ENGINE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (include "agent-orchestrator.fullname" .) }}
                  key: {{ .Values.secrets.temporalEngineTokenKey }}
                  optional: true
            {{- end }}
            {{- if .Values.config.callerToolTtlSeconds }}
            - name: AGENT_CALLER_TOOL_TTL_SECONDS
              value: {{ .Values.config.callerToolTtlSeconds | quote }}
            {{- end }}
            {{- if .Values.config.callerToolPruneIntervalSeconds }}
            - name: AGENT_CALLER_TOOL_PRUNE_INTERVAL_SECONDS
              value: {{ .Values.config.callerToolPruneIntervalSeconds | quote }}
            {{- end }}
            - name: AGENT_EMBEDDING_MODEL
              value: {{ .Values.config.embeddingModel | quote }}
            - name: AGENT_HTTP_PORT
              value: {{ .Values.ports.http | quote }}
            - name: AGENT_CRD_GROUP
              value: {{ .Values.config.crdGroup | quote }}
            - name: AGENT_CRD_VERSION
              value: {{ .Values.config.crdVersion | quote }}
            {{- if .Values.config.agentRunTimeoutSeconds }}
            # Bounds how long one turn's poll of the engine runs before the
            # caller gets a resumable "still running" pause instead.
            - name: AGENT_RUN_TIMEOUT_SECONDS
              value: {{ .Values.config.agentRunTimeoutSeconds | quote }}
            {{- end }}
            {{- if .Values.config.shutdownDrainMs }}
            - name: AGENT_SHUTDOWN_DRAIN_MS
              value: {{ .Values.config.shutdownDrainMs | quote }}
            {{- end }}
            {{/*
            Bearer-token identity (static map / OIDC). Kept wired, but NOT
            enforced: the facade does not authenticate the caller's bearer
            token yet -- only the in-process LangGraph engine did, and it was
            removed (docs/adr/0053). A follow-up wires these back into the
            facade.
            */}}
            {{- if eq .Values.config.identityResolver "oidc" }}
            - name: AGENT_IDENTITY_RESOLVER
              value: "oidc"
            - name: AGENT_OIDC_ISSUER
              value: {{ .Values.config.oidcIssuer | quote }}
            - name: AGENT_OIDC_JWKS_URI
              value: {{ .Values.config.oidcJwksUri | quote }}
            {{- if .Values.config.oidcAudience }}
            - name: AGENT_OIDC_AUDIENCE
              value: {{ .Values.config.oidcAudience | quote }}
            {{- end }}
            {{- if .Values.config.oidcRolesClaim }}
            - name: AGENT_OIDC_ROLES_CLAIM
              value: {{ .Values.config.oidcRolesClaim | quote }}
            {{- end }}
            {{- end }}
            {{/*
            Independent of identityResolver above (not else-if): when oidc is
            primary, a static map here becomes a CompositeIdentityResolver
            fallback for callers that can't present a real OIDC token (e.g.
            Open WebUI) instead of being mutually exclusive with it.
            */}}
            {{- if .Values.config.staticIdentitiesExistingSecret }}
            - name: AGENT_STATIC_IDENTITIES
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.staticIdentitiesExistingSecret }}
                  key: {{ .Values.config.staticIdentitiesExistingSecretKey }}
            {{- else if .Values.config.staticIdentities }}
            - name: AGENT_STATIC_IDENTITIES
              value: {{ .Values.config.staticIdentities | quote }}
            {{- end }}
            {{- if .Values.config.openWebUiUserJwtSecretExistingSecret }}
            - name: AGENT_OPENWEBUI_USER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.openWebUiUserJwtSecretExistingSecret }}
                  key: {{ .Values.config.openWebUiUserJwtSecretExistingSecretKey }}
            {{- end }}
            {{- if .Values.config.openWebUiUserRoles }}
            - name: AGENT_OPENWEBUI_USER_ROLES
              value: {{ .Values.config.openWebUiUserRoles | quote }}
            {{- end }}
            {{- if or .Values.config.redisUrl .Values.redis.enabled }}
            - name: AGENT_REDIS_URL
              value: {{ include "agent-orchestrator.redisUrl" . | quote }}
            {{- end }}
            {{- if .Values.identityLink.enabled }}
            - name: IDENTITY_LINK_GATEWAY_URL
              value: {{ .Values.identityLink.gatewayUrl | quote }}
            {{- if .Values.identityLink.defaultFlow }}
            - name: AGENT_DEFAULT_IDENTITY_LINK_FLOW
              value: {{ .Values.identityLink.defaultFlow | quote }}
            {{- end }}
            {{- if .Values.identityLink.connectionsUrl }}
            - name: AGENT_CONNECTIONS_URL
              value: {{ .Values.identityLink.connectionsUrl | quote }}
            {{- end }}
            {{- end }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (include "agent-orchestrator.fullname" .) }}
                  key: {{ .Values.secrets.openaiApiKeyKey }}
            {{- if or .Values.secrets.qdrantApiKey .Values.secrets.existingSecret }}
            - name: AGENT_QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (include "agent-orchestrator.fullname" .) }}
                  key: {{ .Values.secrets.qdrantApiKeyKey }}
                  optional: true
            {{- end }}
            {{- if .Values.secrets.senderAssertionSecretKey }}
            - name: AGENT_SENDER_ASSERTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (include "agent-orchestrator.fullname" .) }}
                  key: {{ .Values.secrets.senderAssertionSecretKey }}
                  optional: true
            {{- end }}
            {{- if .Values.identityLink.enabled }}
            - name: IDENTITY_LINK_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (include "agent-orchestrator.fullname" .) }}
                  key: {{ .Values.secrets.identityLinkGatewayTokenKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
