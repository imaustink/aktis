{{- if .Values.rbac.create }}
{{/*
Namespace-scoped Role (never a ClusterRole, ADR 0005) granting exactly what
the orchestrator reads: the EventTrigger table it matches every /invoke
`event` envelope against (docs/adr/0048). Everything else -- the Tool/Skill/
Agent catalog, ToolRun/AgentRun creation, Secrets -- belongs to the Temporal
engine's own ServiceAccount since the in-process engine was removed
(docs/adr/0053).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent-orchestrator.fullname" . }}
  namespace: {{ include "agent-orchestrator.toolNamespace" . }}
  labels:
    {{- include "agent-orchestrator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["core.aktis.ai"]
    # Watched, so a missing grant crashloops on a 403.
    resources: ["eventtriggers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent-orchestrator.fullname" . }}
  namespace: {{ include "agent-orchestrator.toolNamespace" . }}
  labels:
    {{- include "agent-orchestrator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent-orchestrator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-orchestrator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
