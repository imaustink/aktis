apiVersion: v2
name: temporal-engine
description: >-
  The Temporal-workflow agent engine (orchestrator/engines/temporal) — worker, gateway and
  catalog-sync. agent-orchestrator forwards every turn here (docs/adr/0036,
  0053), so it is required. Assumes a Temporal cluster is already reachable and
  takes its address, so this adds no stateful component.
type: application
version: 0.2.1
appVersion: "0.1.0"
home: https://github.com/imaustink/aktis
sources:
  - https://github.com/imaustink/aktis
keywords:
  - agent
  - temporal
  - workflow
  - durable-execution
maintainers:
  - name: controller-agent
