apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: controller-agent

# Single-command dev loop for the whole controller-agent stack: two Helm
# releases -- `agent-controller` (the system: orchestrator, core-controller +
# CRDs, optional infra) and `community-components` (the Tool/Skill/Agent
# catalog) -- deployed from one `skaffold` invocation. Replaces the manual
# build/dependency-update/apply/rollout sequence in scripts/dev-up.sh:
#   ./scripts/cluster/cluster.sh skaffold dev     # build + deploy both releases, then watch files and redeploy on change
#   ./scripts/cluster/cluster.sh skaffold run     # one-shot build + deploy
#   ./scripts/cluster/cluster.sh skaffold delete  # tear down both releases this config created
#
# Run it through scripts/cluster/cluster.sh rather than bare: which local
# cluster this is (ferry, minikube, kind, your own) decides flags skaffold
# needs -- ferry's registry as the default repo, for one -- and the wrapper is
# what knows. See docs/local-cluster.md.
#
# Adding a new image to the stack = add one entry to build.artifacts (+ a
# setValueTemplates line below if the relevant chart needs to know its tag).
# No shell script changes required.
#
# Prerequisites this file deliberately does NOT own -- scripts/dev-up.sh
# still handles these before invoking skaffold, since Skaffold's helm
# deployer has no before/after hook support (only its kubectl deployer does):
#   - starting the local cluster, the three bootstrap Secrets, the recipe-scraper/
#     recipe-publisher/opencode-swe-agent ServiceAccounts
#   - `helm dependency update` on the agent-orchestrator subchart itself
#     (its own qdrant dependency; Helm doesn't recurse into file:// subcharts,
#     so skipBuildDependencies below only covers each chart's own direct deps)
#   - applying orchestrator/charts/aktis/charts/core-controller/crds/*.yaml
#     --server-side (Helm's crds/ dir is install-only; upgrades never touch it)

build:
  # Every artifact is a `custom` build running scripts/cluster/build-image.sh,
  # not skaffold's own docker builder, because HOW an image is built and
  # reaches the cluster depends on which local cluster it is: `ferry image
  # build` with no Docker anywhere, minikube's own daemon, `docker build` +
  # `kind load`, or a push to a registry. The script asks the selected
  # provider (scripts/cluster/providers/); the flags after it are the same
  # Dockerfile and build args the docker builder took, and `dependencies`
  # repeats them so skaffold still knows what to watch and when to rebuild.
  #
  # buildCommand runs from the artifact's `context`, hence the ../../.. on the
  # artifacts that set one.
  #
  # No `local.push`: skaffold recognises minikube and kind contexts as local
  # and never pushes to them; for any other context it "pushes", which on
  # ferry is a no-op (the build already landed in ferry's registry) and on a
  # custom cluster is a real push to AKTIS_CLUSTER_REGISTRY. The `no-push`
  # profile at the bottom is for a custom cluster with no registry.
  local:
    useDockerCLI: true
  # Unique tags per build (default gitCommit-based) so a Helm upgrade always
  # changes the Deployment's pod template -- pods roll automatically on every
  # `skaffold dev`/`run`, no manual `kubectl rollout restart` needed anymore.
  tagPolicy:
    gitCommit:
      variant: AbbrevCommitSha
  artifacts:
    - image: agent-orchestrator
      custom:
        buildCommand: ./scripts/cluster/build-image.sh -f orchestrator/apps/agent-orchestrator/Dockerfile
        dependencies:
          dockerfile:
            path: orchestrator/apps/agent-orchestrator/Dockerfile
    - image: core-controller
      context: orchestrator/controllers/core-controller
      custom:
        buildCommand: ../../../scripts/cluster/build-image.sh -f Dockerfile
        dependencies:
          dockerfile:
            path: Dockerfile
    - image: recipe-scraper
      custom:
        buildCommand: ./scripts/cluster/build-image.sh -f catalog/tools/recipe-scraper/Dockerfile
        dependencies:
          dockerfile:
            path: catalog/tools/recipe-scraper/Dockerfile
    - image: recipe-publisher
      custom:
        buildCommand: ./scripts/cluster/build-image.sh -f catalog/tools/recipe-publisher/Dockerfile
        dependencies:
          dockerfile:
            path: catalog/tools/recipe-publisher/Dockerfile
    - image: web-search
      custom:
        buildCommand: ./scripts/cluster/build-image.sh -f catalog/tools/web-search/Dockerfile
        dependencies:
          dockerfile:
            path: catalog/tools/web-search/Dockerfile
    - image: image-gen
      custom:
        buildCommand: ./scripts/cluster/build-image.sh -f catalog/tools/image-gen/Dockerfile
        dependencies:
          dockerfile:
            path: catalog/tools/image-gen/Dockerfile
    - image: opencode-swe-agent
      custom:
        buildCommand: ./scripts/cluster/build-image.sh -f catalog/agents/opencode-swe-agent/Dockerfile
        dependencies:
          dockerfile:
            path: catalog/agents/opencode-swe-agent/Dockerfile
    # One Dockerfile, four runtimes via --build-arg (mirrors dev-up.sh).
    - image: localtool-executor-node
      context: orchestrator/sidecars/localtool-executor
      custom:
        buildCommand: ../../../scripts/cluster/build-image.sh -f Dockerfile --build-arg BASE_IMAGE=node:24-bookworm-slim --build-arg RUNTIME=node
        dependencies:
          dockerfile:
            path: Dockerfile
            buildArgs:
              BASE_IMAGE: node:24-bookworm-slim
              RUNTIME: node
    - image: localtool-executor-python
      context: orchestrator/sidecars/localtool-executor
      custom:
        buildCommand: ../../../scripts/cluster/build-image.sh -f Dockerfile --build-arg BASE_IMAGE=python:3.12-slim-bookworm --build-arg RUNTIME=python
        dependencies:
          dockerfile:
            path: Dockerfile
            buildArgs:
              BASE_IMAGE: python:3.12-slim-bookworm
              RUNTIME: python
    - image: localtool-executor-go
      context: orchestrator/sidecars/localtool-executor
      custom:
        buildCommand: ../../../scripts/cluster/build-image.sh -f Dockerfile --build-arg BASE_IMAGE=golang:1.24-bookworm --build-arg RUNTIME=go
        dependencies:
          dockerfile:
            path: Dockerfile
            buildArgs:
              BASE_IMAGE: golang:1.24-bookworm
              RUNTIME: go
    - image: localtool-executor-shell
      context: orchestrator/sidecars/localtool-executor
      custom:
        buildCommand: ../../../scripts/cluster/build-image.sh -f Dockerfile --build-arg BASE_IMAGE=debian:bookworm-slim --build-arg RUNTIME=shell
        dependencies:
          dockerfile:
            path: Dockerfile
            buildArgs:
              BASE_IMAGE: debian:bookworm-slim
              RUNTIME: shell

manifests: {}

deploy:
  helm:
    releases:
      # Deployed first: owns the CRDs that community-components' CRs need.
      # Skaffold's helm deployer runs releases in the order listed here.
      - name: agent-controller
        chartPath: orchestrator/charts/aktis
        namespace: controller-agent
        createNamespace: true
        wait: true
        valuesFiles:
          - orchestrator/charts/aktis/values-minikube-demo.yaml
        # false = skaffold runs `helm dependency build` on this chart itself
        # before every deploy. It does NOT recurse into the nested
        # agent-orchestrator/qdrant dependency (file:// subcharts aren't
        # recursive in Helm) -- scripts/dev-up.sh still runs that one
        # `helm dependency update` command before invoking skaffold.
        skipBuildDependencies: false
        # Maps each built image to the value the chart expects. Image name ->
        # template var: dashes become underscores, see Skaffold's helm docs
        # ("Deploy with helm") for IMAGE_REPO_*/IMAGE_TAG_*/IMAGE_FULLY_QUALIFIED_*.
        setValueTemplates:
          agent-orchestrator.image.repository: "{{.IMAGE_REPO_agent_orchestrator}}"
          agent-orchestrator.image.tag: "{{.IMAGE_TAG_agent_orchestrator}}"
          core-controller.image.repository: "{{.IMAGE_REPO_core_controller}}"
          core-controller.image.tag: "{{.IMAGE_TAG_core_controller}}"
      # Deployed second: needs agent-controller's CRDs to already exist.
      - name: community-components
        chartPath: orchestrator/charts/community-components
        namespace: controller-agent
        createNamespace: true
        wait: true
        valuesFiles:
          - orchestrator/charts/community-components/values-minikube-demo.yaml
        skipBuildDependencies: false
        setValueTemplates:
          recipeScraper.image: "{{.IMAGE_FULLY_QUALIFIED_recipe_scraper}}"
          recipePublisher.image: "{{.IMAGE_FULLY_QUALIFIED_recipe_publisher}}"
          opencodeSweAgent.image: "{{.IMAGE_FULLY_QUALIFIED_opencode_swe_agent}}"
          webSearch.image: "{{.IMAGE_FULLY_QUALIFIED_web_search}}"

# ─────────────────────────────────────────────────────────────────────────────
# e2e profile: `skaffold run -p e2e`
#
# The default profile deliberately does NOT build integration-gateway (the
# minikube demo profile leaves it disabled, so there's nothing to run) — but
# the e2e suite's whole entry point is a GitHub webhook hitting that gateway.
# This profile adds the missing image and layers charts/*/values-e2e.yaml on
# top of the demo values.
#
# Kept as a profile rather than added to the default build so an ordinary
# `skaffold dev` doesn't pay to rebuild two extra images nobody's using.
profiles:
  - name: e2e
    build:
      artifacts:
        - image: agent-orchestrator
          custom:
            buildCommand: ./scripts/cluster/build-image.sh -f orchestrator/apps/agent-orchestrator/Dockerfile
            dependencies:
              dockerfile:
                path: orchestrator/apps/agent-orchestrator/Dockerfile
        - image: core-controller
          context: orchestrator/controllers/core-controller
          custom:
            buildCommand: ../../../scripts/cluster/build-image.sh -f Dockerfile
            dependencies:
              dockerfile:
                path: Dockerfile
        - image: integration-gateway
          custom:
            buildCommand: ./scripts/cluster/build-image.sh -f orchestrator/apps/integration-gateway/Dockerfile
            dependencies:
              dockerfile:
                path: orchestrator/apps/integration-gateway/Dockerfile
        # values-e2e.yaml turns the broker on: the knowledge-base specs cannot
        # sync a corpus without it, and an unbuilt image sits in
        # ImagePullBackOff until up.sh times out.
        - image: connection-broker
          custom:
            buildCommand: ./scripts/cluster/build-image.sh -f orchestrator/apps/connection-broker/Dockerfile
            dependencies:
              dockerfile:
                path: orchestrator/apps/connection-broker/Dockerfile
        # values-e2e.yaml turns the mcp-broker on so the MCP specs can discover
        # and call the fake MCP server below; an unbuilt image would sit in
        # ImagePullBackOff until up.sh times out (ADR 0045).
        - image: mcp-broker
          custom:
            buildCommand: ./scripts/cluster/build-image.sh -f orchestrator/apps/mcp-broker/Dockerfile
            dependencies:
              dockerfile:
                path: orchestrator/apps/mcp-broker/Dockerfile
        # The in-cluster MCP server the mcp-broker discovers and proxies to —
        # the only MCP stub, deterministic, built here so skaffold rewrites its
        # image in the community-components fixture.
        - image: fake-mcp-server
          custom:
            buildCommand: ./scripts/cluster/build-image.sh -f orchestrator/apps/fake-mcp-server/Dockerfile
            dependencies:
              dockerfile:
                path: orchestrator/apps/fake-mcp-server/Dockerfile
        - image: opencode-swe-agent
          custom:
            buildCommand: ./scripts/cluster/build-image.sh -f catalog/agents/opencode-swe-agent/Dockerfile
            dependencies:
              dockerfile:
                path: catalog/agents/opencode-swe-agent/Dockerfile
        # Needed by the community-components release below: its Tool/Agent CRs
        # pin image tags, and a release deployed without freshly-built tags
        # leaves AgentRun pods stuck in ImagePullBackOff on a stale tag that
        # no longer exists in the cluster.
        - image: recipe-scraper
          custom:
            buildCommand: ./scripts/cluster/build-image.sh -f catalog/tools/recipe-scraper/Dockerfile
            dependencies:
              dockerfile:
                path: catalog/tools/recipe-scraper/Dockerfile
        - image: recipe-publisher
          custom:
            buildCommand: ./scripts/cluster/build-image.sh -f catalog/tools/recipe-publisher/Dockerfile
            dependencies:
              dockerfile:
                path: catalog/tools/recipe-publisher/Dockerfile
        - image: web-search
          custom:
            buildCommand: ./scripts/cluster/build-image.sh -f catalog/tools/web-search/Dockerfile
            dependencies:
              dockerfile:
                path: catalog/tools/web-search/Dockerfile
        # The e2e triage route targets this agent (see
        # orchestrator/charts/community-components/values-e2e.yaml): it declares the same
        # Claude identityProviders as claude-code-swe-agent, so the credential
        # gate behaves identically, but replies over NATS without a model call
        # so a run can actually reach a terminal phase in a cluster holding no
        # Anthropic credential.
        - image: stub-agent
          custom:
            buildCommand: ./scripts/cluster/build-image.sh -f catalog/agents/stub-agent/Dockerfile
            dependencies:
              dockerfile:
                path: catalog/agents/stub-agent/Dockerfile
        # Still built: its Agent CR stays enabled as the production-shaped
        # reference the stub's providers are kept in step with, and its CR pins
        # an image tag -- a release deployed without a freshly-built one leaves
        # the tag dangling in the cluster.
        - image: claude-code-swe-agent
          custom:
            buildCommand: ./scripts/cluster/build-image.sh -f catalog/agents/claude-code-swe-agent/Dockerfile
            dependencies:
              dockerfile:
                path: catalog/agents/claude-code-swe-agent/Dockerfile
        # The chart defaults route every turn through the Temporal engine, and
        # the demo values turn on the LocalTool executor sidecars, so neither
        # set is optional here. Unbuilt, they only worked on a cluster that
        # still held `:latest` copies from some earlier manual build; a
        # fresh cluster sat in ImagePullBackOff until `up.sh` timed out.
        - image: temporal-engine-worker
          context: orchestrator/engines/temporal
          custom:
            buildCommand: ../../../scripts/cluster/build-image.sh -f Dockerfile.worker
            dependencies:
              dockerfile:
                path: Dockerfile.worker
        - image: temporal-engine-gateway
          context: orchestrator/engines/temporal
          custom:
            buildCommand: ../../../scripts/cluster/build-image.sh -f Dockerfile.gateway
            dependencies:
              dockerfile:
                path: Dockerfile.gateway
        - image: temporal-engine-catalog-sync
          context: orchestrator/engines/temporal
          custom:
            buildCommand: ../../../scripts/cluster/build-image.sh -f Dockerfile.catalog-sync
            dependencies:
              dockerfile:
                path: Dockerfile.catalog-sync
        - image: localtool-executor-node
          context: orchestrator/sidecars/localtool-executor
          custom:
            buildCommand: ../../../scripts/cluster/build-image.sh -f Dockerfile --build-arg BASE_IMAGE=node:24-bookworm-slim --build-arg RUNTIME=node
            dependencies:
              dockerfile:
                path: Dockerfile
                buildArgs:
                  BASE_IMAGE: node:24-bookworm-slim
                  RUNTIME: node
        - image: localtool-executor-python
          context: orchestrator/sidecars/localtool-executor
          custom:
            buildCommand: ../../../scripts/cluster/build-image.sh -f Dockerfile --build-arg BASE_IMAGE=python:3.12-slim-bookworm --build-arg RUNTIME=python
            dependencies:
              dockerfile:
                path: Dockerfile
                buildArgs:
                  BASE_IMAGE: python:3.12-slim-bookworm
                  RUNTIME: python
        - image: localtool-executor-go
          context: orchestrator/sidecars/localtool-executor
          custom:
            buildCommand: ../../../scripts/cluster/build-image.sh -f Dockerfile --build-arg BASE_IMAGE=golang:1.24-bookworm --build-arg RUNTIME=go
            dependencies:
              dockerfile:
                path: Dockerfile
                buildArgs:
                  BASE_IMAGE: golang:1.24-bookworm
                  RUNTIME: go
        - image: localtool-executor-shell
          context: orchestrator/sidecars/localtool-executor
          custom:
            buildCommand: ../../../scripts/cluster/build-image.sh -f Dockerfile --build-arg BASE_IMAGE=debian:bookworm-slim --build-arg RUNTIME=shell
            dependencies:
              dockerfile:
                path: Dockerfile
                buildArgs:
                  BASE_IMAGE: debian:bookworm-slim
                  RUNTIME: shell
    deploy:
      helm:
        releases:
          - name: agent-controller
            chartPath: orchestrator/charts/aktis
            namespace: controller-agent
            createNamespace: true
            # Deliberately NOT `wait: true` here, unlike the default profile.
            #
            # Skaffold installs these releases in order and stops at the first
            # failure, and `wait` turns "one workload is slow or crashlooping"
            # into "this release failed". The release that then never installs
            # is community-components -- the one that owns every Tool/Skill/
            # Agent CR -- so the cluster comes up with a working orchestrator
            # and an EMPTY catalog. Nothing says so: helm reports only
            # `context deadline exceeded` against agent-controller, and the
            # suite goes on to spend its per-test budgets waiting for runs that
            # can never be dispatched because no Agent exists to dispatch to.
            #
            # The two releases are independent at install time (community-
            # components needs the CRDs, which up.sh applies out of band before
            # either), so there is nothing to be gained by gating the second on
            # the first being *ready*. Readiness is re-checked explicitly at the
            # end of e2e/scripts/up.sh, which fails with a readable pod list
            # instead of a deadline.
            wait: false
            valuesFiles:
              - orchestrator/charts/aktis/values-minikube-demo.yaml
              - orchestrator/charts/aktis/values-e2e.yaml
            skipBuildDependencies: false
            setValueTemplates:
              agent-orchestrator.image.repository: "{{.IMAGE_REPO_agent_orchestrator}}"
              agent-orchestrator.image.tag: "{{.IMAGE_TAG_agent_orchestrator}}"
              core-controller.image.repository: "{{.IMAGE_REPO_core_controller}}"
              core-controller.image.tag: "{{.IMAGE_TAG_core_controller}}"
              integration-gateway.image.repository: "{{.IMAGE_REPO_integration_gateway}}"
              integration-gateway.image.tag: "{{.IMAGE_TAG_integration_gateway}}"
              connection-broker.image.repository: "{{.IMAGE_REPO_connection_broker}}"
              connection-broker.image.tag: "{{.IMAGE_TAG_connection_broker}}"
              # The chart defaults connection-broker to pullPolicy Always (its
              # production :latest tag needs freshness). skaffold builds a local,
              # digest-tagged image that exists only in the local cluster and in
              # no real registry, so Always makes the kubelet try to pull it and
              # fail ("can't be pulled"). Every other image here is IfNotPresent
              # by default; override the broker to match for the local path.
              connection-broker.image.pullPolicy: "IfNotPresent"
              mcp-broker.image.repository: "{{.IMAGE_REPO_mcp_broker}}"
              mcp-broker.image.tag: "{{.IMAGE_TAG_mcp_broker}}"
              temporal-engine.worker.image.repository: "{{.IMAGE_REPO_temporal_engine_worker}}"
              temporal-engine.worker.image.tag: "{{.IMAGE_TAG_temporal_engine_worker}}"
              temporal-engine.gateway.image.repository: "{{.IMAGE_REPO_temporal_engine_gateway}}"
              temporal-engine.gateway.image.tag: "{{.IMAGE_TAG_temporal_engine_gateway}}"
              temporal-engine.catalogSync.image.repository: "{{.IMAGE_REPO_temporal_engine_catalog_sync}}"
              temporal-engine.catalogSync.image.tag: "{{.IMAGE_TAG_temporal_engine_catalog_sync}}"
          # A profile replaces deploy.helm.releases wholesale -- omitting this
          # silently drops the chart that owns every Tool/Skill/Agent CR, so
          # the cluster keeps whatever CRs an older install left behind,
          # pointing at image tags that no longer exist.
          - name: community-components
            chartPath: orchestrator/charts/community-components
            namespace: controller-agent
            createNamespace: true
            wait: true
            valuesFiles:
              - orchestrator/charts/community-components/values-minikube-demo.yaml
              - orchestrator/charts/community-components/values-e2e.yaml
            skipBuildDependencies: false
            setValueTemplates:
              stubAgent.image: "{{.IMAGE_FULLY_QUALIFIED_stub_agent}}"
              stubSweAgent.image: "{{.IMAGE_FULLY_QUALIFIED_stub_agent}}"
              fakeMcpServer.image: "{{.IMAGE_FULLY_QUALIFIED_fake_mcp_server}}"
              claudeCodeSweAgent.image: "{{.IMAGE_FULLY_QUALIFIED_claude_code_swe_agent}}"
              recipeScraper.image: "{{.IMAGE_FULLY_QUALIFIED_recipe_scraper}}"
              recipePublisher.image: "{{.IMAGE_FULLY_QUALIFIED_recipe_publisher}}"
              opencodeSweAgent.image: "{{.IMAGE_FULLY_QUALIFIED_opencode_swe_agent}}"
              webSearch.image: "{{.IMAGE_FULLY_QUALIFIED_web_search}}"

  # no-push: for a `custom` cluster (docs/local-cluster.md) that has no
  # registry to push to. Skaffold pushes to any context it does not recognise
  # as minikube/kind; this turns that off, and the provider loads each image
  # with AKTIS_CLUSTER_LOAD_CMD instead. Added by scripts/cluster/cluster.sh --
  # not something to pass by hand.
  - name: no-push
    patches:
      - op: add
        path: /build/local/push
        value: false
